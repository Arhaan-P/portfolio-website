<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="567" viewBox="0 110 1400 567" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60a5fa" fill-opacity="0.85"/>
    </marker>
    <marker id="arrowhead2-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60a5fa" fill-opacity="0.9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="787" fill="#0a0e14"/>

  <!-- converging arrows into Verification Net -->
  <line x1="300" y1="215" x2="382" y2="360" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead2)"/>
  <line x1="300" y1="572" x2="382" y2="427" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead2)"/>

  <!-- Verification Net -> Verdict -->
  <line x1="650" y1="393.5" x2="734" y2="393.5" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.75" marker-end="url(#arrowhead2-amber)"/>

  <!-- Verdict -> Evaluation sidebar -->
  <line x1="1000" y1="393.5" x2="1084" y2="393.5" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead2)"/>

  <!-- Query Video -->
  <g>
    <rect x="40" y="140" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="170" y="200" text-anchor="middle" font-size="23" font-weight="600" fill="#f1f5f9">Query Video</text>
    <text x="170" y="230" text-anchor="middle" font-size="19" fill="#94a3b8">MediaPipe pose →</text>
    <text x="170" y="254" text-anchor="middle" font-size="19" fill="#94a3b8">78-dim gait sequence</text>
  </g>

  <!-- Enrolled Signature -->
  <g>
    <rect x="40" y="497" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="170" y="557" text-anchor="middle" font-size="23" font-weight="600" fill="#f1f5f9">Enrolled Signature</text>
    <text x="170" y="587" text-anchor="middle" font-size="19" fill="#94a3b8">claimed identity's</text>
    <text x="170" y="611" text-anchor="middle" font-size="19" fill="#94a3b8">stored gait profile</text>
  </g>

  <!-- Verification Net -->
  <g>
    <rect x="390" y="318.5" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="520" y="373.5" text-anchor="middle" font-size="22" font-weight="600" fill="#f1f5f9">Verification Net</text>
    <text x="520" y="403.5" text-anchor="middle" font-size="19" fill="#94a3b8">diff · |diff| · product →</text>
    <text x="520" y="427.5" text-anchor="middle" font-size="19" fill="#94a3b8">temporal CNN, 133K params</text>
  </g>

  <!-- Verdict -->
  <g>
    <rect x="740" y="318.5" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="870" y="373.5" text-anchor="middle" font-size="23" font-weight="600" fill="#f1f5f9">Verdict</text>
    <text x="870" y="403.5" text-anchor="middle" font-size="19" fill="#94a3b8">AUTHENTIC / MISMATCH</text>
    <text x="870" y="427.5" text-anchor="middle" font-size="19" fill="#94a3b8">/ SUSPECTED DEEPFAKE</text>
  </g>

  <!-- Evaluation sidebar -->
  <g>
    <rect x="1090" y="140" width="270" height="507" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="1225" y="180" text-anchor="middle" font-size="22" font-weight="600" fill="#f1f5f9">Evaluation</text>
    <line x1="1120" y1="198" x2="1330" y2="198" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1"/>

    <text x="1225" y="238" text-anchor="middle" font-size="26" font-weight="700" fill="#60a5fa">94.95%</text>
    <text x="1225" y="262" text-anchor="middle" font-size="18" fill="#94a3b8">pooled AUC-ROC</text>

    <text x="1225" y="308" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">13-fold</text>
    <text x="1225" y="332" text-anchor="middle" font-size="18" fill="#94a3b8">subject-disjoint LOOCV</text>

    <text x="1225" y="378" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">12.77%</text>
    <text x="1225" y="402" text-anchor="middle" font-size="18" fill="#94a3b8">pooled Equal Error Rate</text>

    <text x="1225" y="448" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">3 / 3</text>
    <text x="1225" y="472" text-anchor="middle" font-size="18" fill="#94a3b8">real face-swap clips</text>
    <text x="1225" y="494" text-anchor="middle" font-size="18" fill="#94a3b8">correctly rejected</text>

    <line x1="1120" y1="522" x2="1330" y2="522" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1"/>
    <text x="1225" y="552" text-anchor="middle" font-size="17" fill="#94a3b8">ablation: adding the</text>
    <text x="1225" y="574" text-anchor="middle" font-size="17" fill="#94a3b8">auxiliary CNN+BiLSTM+</text>
    <text x="1225" y="596" text-anchor="middle" font-size="17" fill="#94a3b8">Transformer branch to this</text>
    <text x="1225" y="618" text-anchor="middle" font-size="17" fill="#94a3b8">decision path only hurts it</text>
  </g>
</svg>
