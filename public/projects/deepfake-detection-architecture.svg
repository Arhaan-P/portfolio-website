<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="787" viewBox="0 0 1400 787" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60a5fa" fill-opacity="0.85"/>
    </marker>
    <marker id="arrowhead2-amber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#f59e0b" fill-opacity="0.9"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="787" fill="#0a0e14"/>

  <!-- converging arrows into Verification Net -->
  <line x1="300" y1="215" x2="382" y2="360" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead2)"/>
  <line x1="300" y1="572" x2="382" y2="427" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead2)"/>

  <!-- Verification Net -> Verdict -->
  <line x1="650" y1="393.5" x2="734" y2="393.5" stroke="#f59e0b" stroke-width="2.5" stroke-opacity="0.75" marker-end="url(#arrowhead2-amber)"/>

  <!-- Verdict -> Evaluation sidebar -->
  <line x1="1000" y1="393.5" x2="1084" y2="393.5" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead2)"/>

  <!-- Query Video -->
  <g>
    <rect x="40" y="140" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="170" y="205" text-anchor="middle" font-size="23" font-weight="600" fill="#f1f5f9">Query Video</text>
    <text x="170" y="234" text-anchor="middle" font-size="13.5" fill="#94a3b8">MediaPipe pose →</text>
    <text x="170" y="253" text-anchor="middle" font-size="13.5" fill="#94a3b8">78-dim gait sequence</text>
  </g>

  <!-- Enrolled Signature -->
  <g>
    <rect x="40" y="497" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="170" y="562" text-anchor="middle" font-size="23" font-weight="600" fill="#f1f5f9">Enrolled Signature</text>
    <text x="170" y="591" text-anchor="middle" font-size="13.5" fill="#94a3b8">claimed identity's</text>
    <text x="170" y="610" text-anchor="middle" font-size="13.5" fill="#94a3b8">stored gait profile</text>
  </g>

  <!-- Verification Net -->
  <g>
    <rect x="390" y="318.5" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="520" y="378.5" text-anchor="middle" font-size="22" font-weight="600" fill="#f1f5f9">Verification Net</text>
    <text x="520" y="407.5" text-anchor="middle" font-size="13.5" fill="#94a3b8">diff · |diff| · product →</text>
    <text x="520" y="426.5" text-anchor="middle" font-size="13.5" fill="#94a3b8">temporal CNN, 133K params</text>
  </g>

  <!-- Verdict -->
  <g>
    <rect x="740" y="318.5" width="260" height="150" rx="16" fill="#10151f" stroke="#f59e0b" stroke-opacity="0.55" stroke-width="1.5"/>
    <text x="870" y="378.5" text-anchor="middle" font-size="23" font-weight="600" fill="#f1f5f9">Verdict</text>
    <text x="870" y="407.5" text-anchor="middle" font-size="13.5" fill="#94a3b8">AUTHENTIC / MISMATCH</text>
    <text x="870" y="426.5" text-anchor="middle" font-size="13.5" fill="#94a3b8">/ SUSPECTED DEEPFAKE</text>
  </g>

  <!-- Evaluation sidebar -->
  <g>
    <rect x="1090" y="140" width="270" height="507" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="1225" y="185" text-anchor="middle" font-size="20" font-weight="600" fill="#f1f5f9">Evaluation</text>
    <line x1="1120" y1="205" x2="1330" y2="205" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1"/>

    <text x="1225" y="248" text-anchor="middle" font-size="26" font-weight="700" fill="#f59e0b">94.95%</text>
    <text x="1225" y="270" text-anchor="middle" font-size="12.5" fill="#94a3b8">pooled AUC-ROC</text>

    <text x="1225" y="330" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">13-fold</text>
    <text x="1225" y="352" text-anchor="middle" font-size="12.5" fill="#94a3b8">subject-disjoint LOOCV</text>

    <text x="1225" y="412" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">12.77%</text>
    <text x="1225" y="434" text-anchor="middle" font-size="12.5" fill="#94a3b8">pooled Equal Error Rate</text>

    <text x="1225" y="494" text-anchor="middle" font-size="26" font-weight="700" fill="#f1f5f9">3 / 3</text>
    <text x="1225" y="516" text-anchor="middle" font-size="12.5" fill="#94a3b8">real face-swap clips</text>
    <text x="1225" y="533" text-anchor="middle" font-size="12.5" fill="#94a3b8">correctly rejected</text>

    <line x1="1120" y1="570" x2="1330" y2="570" stroke="#60a5fa" stroke-opacity="0.25" stroke-width="1"/>
    <text x="1225" y="600" text-anchor="middle" font-size="12" fill="#64748b">ablation: adding the auxiliary</text>
    <text x="1225" y="617" text-anchor="middle" font-size="12" fill="#64748b">CNN+BiLSTM+Transformer branch</text>
    <text x="1225" y="634" text-anchor="middle" font-size="12" fill="#64748b">to this decision path only hurts it</text>
  </g>
</svg>
