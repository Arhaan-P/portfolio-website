<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="787" viewBox="0 0 1400 787" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#60a5fa" fill-opacity="0.85"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="787" fill="#0a0e14"/>

  <!-- arrows -->
  <line x1="300" y1="393.5" x2="384" y2="393.5" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead)"/>
  <line x1="650" y1="393.5" x2="734" y2="393.5" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead)"/>
  <line x1="1000" y1="393.5" x2="1084" y2="393.5" stroke="#60a5fa" stroke-width="2.5" stroke-opacity="0.6" marker-end="url(#arrowhead)"/>

  <!-- Saboteur -->
  <g>
    <rect x="40" y="318.5" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="170" y="386.5" text-anchor="middle" font-size="24" font-weight="600" fill="#f1f5f9">Saboteur</text>
    <text x="170" y="415.5" text-anchor="middle" font-size="14" fill="#94a3b8">deterministic AST mutation</text>
  </g>

  <!-- Agent -->
  <g>
    <rect x="390" y="318.5" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="520" y="386.5" text-anchor="middle" font-size="24" font-weight="600" fill="#f1f5f9">Agent</text>
    <text x="520" y="415.5" text-anchor="middle" font-size="14" fill="#94a3b8">LangGraph, 3 attempts</text>
  </g>

  <!-- Sandbox -->
  <g>
    <rect x="740" y="318.5" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="870" y="386.5" text-anchor="middle" font-size="24" font-weight="600" fill="#f1f5f9">Sandbox</text>
    <text x="870" y="415.5" text-anchor="middle" font-size="14" fill="#94a3b8">network-isolated Docker</text>
  </g>

  <!-- Eval -->
  <g>
    <rect x="1090" y="318.5" width="260" height="150" rx="16" fill="#10151f" stroke="#60a5fa" stroke-opacity="0.45" stroke-width="1.5"/>
    <text x="1220" y="386.5" text-anchor="middle" font-size="24" font-weight="600" fill="#f1f5f9">Eval</text>
    <text x="1220" y="415.5" text-anchor="middle" font-size="14" fill="#94a3b8">pass@k, SEM</text>
  </g>
</svg>
